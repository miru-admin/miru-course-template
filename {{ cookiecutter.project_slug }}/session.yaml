#
# session.yaml は、course.yaml の object_id で指定されたオブジェクトのうち、type: session のものを定義するための Yaml ファイルです。
# "session.yaml" という名前は変更しないでください。
#
- session_id: bunsho-hajime  # course.yaml で指定したIDです。
  display_name: はじめに  # アプリに表示される、セッションのタイトルです。
  write_session_diary: false  # true だと、セッションが終わった後、Diary 入力画面に移ります。
  docs_before:  # セッションを始める前に提示する文書ファイルです。
    - bunsho-hajime.html
  # chunks が指定されていないため、このセッションは、文書を表示するだけで終わります。

- session_id: kougi-1
  display_name: 1日目：呼吸瞑想
  # write_session_diary のデフォルトは true です。
  docs_before:
    - bunsho-1.html
  chunks:  # このセッションを構成する chunk のIDを指定します。IDは自由に命名可能です。ここに指定したIDを、chunk_{}.yaml から探します。
    - intro
    - 1-001
    - kokyu
    - 1-002
  docs_after:
    - doc-1-2.html  # セッションが終わった後に提示する文書ファイルです。

- session_id: kougi-2
  display_name: 2日目：ボディスキャン
  docs_before:
    - doc-2-1.html
  chunks:
    - intro  # 前のセッションに出た chunk を再び指定することが可能です。
    - 2-001
    - bodyscan
    - 2-002
  docs_after:
    - doc-2-2.html

- session_id: kougi-3
  display_name: 3日目：まとめ
  docs_before:
    - doc-3-1.html
  chunks:
    - intro
    - 3-001
    - kokyu
    - 3-002
    - bodyscan
    - 3-003
  docs_after:  セッション前後に提示する文書ファイルを、複数指定することもできます。指定された順に提示されます。
    - doc-3-2.html
    - doc-3-3.html

- session_id: doc-post
  display_name: ありがとうございました。
  write_session_diary: false
  docs_before:
    - doc-post
