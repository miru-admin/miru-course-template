- type: select
  prompt: >
    以下の問は、最近のあなたの状態について尋ねています。
    過去2週間を振り返り、直感に従って深く考え込みすぎずにお答えください。
  choices:
    - 気分が落ち込むことが多い。
    - これまで好きだったことがあまり楽しく感じられない。
    - 寝つきが悪い、または寝すぎることがある。
    - 体がだるく、何をするのもおっくうだ。
    - 食欲があまりない、または食べすぎてしまう。
    - 自分には価値がないと感じることがある。
  items:
  - あてはまらない
  - ""  # このように、""（空白）を指定することも可能です。
  - どちらともいえない
  - ""
  - あてはまる