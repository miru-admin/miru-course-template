- type: select
  shuffle_items: true  # 項目順をシャッフルします
  shuffle_label_position: true  # 項目ごとに、ラベルの左右をランダムに入れ替えます
  prompt: >  # 各質問項目を提示する前に表示する文章
    以下に、性格に関して述べた文章を挙げます。
    これらが自分にどの程度当てはまると思うか、回答してください。
    あまり深く考え込まず、直感的に回答してください。

  items:
    - 1. 私は、初対面の人ともすぐに打ち解けるほうだ。
    - 2. 他人の気持ちや立場を考えて行動するようにしている。
    - 3. 約束や締め切りは、必ず守るようにしている。
    - 4. 予想外の出来事が起きても、落ち着いて対応できるほうだ。
    - 5. 新しいアイデアや方法を試すことが好きだ。
    - 6. 自分の考えをはっきりと主張するのが得意だ。
    - 7. 些細なことで気持ちが乱れることがある。
    - 8. 他人と競うよりも、協力して物事を進めたいと思う。
    
  choices:
    - まったくあてはまらない
    - あてはまらない
    - あまりあてはまらない
    - どちらともいえない
    - ややあてはまる
    - あてはまる
    - とてもあてはまる
