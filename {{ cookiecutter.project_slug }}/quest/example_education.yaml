- type: select
  items_layout: top_to_bottom  # デフォルトは "left_to_right"。"top_to_bottom" にすると、選択肢が横（縦書き）ではなく縦（横書き）に並びます。
  prompt: >
    ここでは、あなたとあなたのご両親の最終学歴について尋ねます。
    育ての母親、父親にもっとも近い人についてお答えください。
  items:
    - あなたの最終学歴は？
    - あなたの母親の最終学歴は？
    - あなたの父親の最終学歴は？
  choices:  # このように、選択肢が８個程度以上ある場合は、"top_to_bottom" がオススメです。
    - 小学校卒業
    - 中学校卒業
    - 高校在籍に一年未満
    - 高校在籍一年以上
    - 高校卒業
    - 大学在籍一年未満
    - 大学在籍一年以上
    - 大学卒業
    - 大学院卒業
    - わからない
    - 上記のどれとも言えない

- type: root  # 質問紙分岐・スキップのためにアプリが覚えておける回答は、最新一件のみです。上の３問への回答いずれかが〜といった条件で分岐はできません。
  prompt: あなたやあなたの両親の最終学歴について、「上記のどれとも言えない」を選択しましたか？
  choices:
    - いいえ
    - はい
