#
# chunk_{}.yaml は、session.yaml の chunks で指定されたチャンクを定義するための Yaml ファイルです。
# {} には、course.yaml で指定した variation_suffix を当てはめてください。
# 別の chunk_{}.yaml とまったく違う構成にすることもできます。
# ただし、session.yaml に指定されたチャンクはすべてここで定義される必要があります。
#
- chunk_id: chunk-1-1  # session.yaml で指定したIDです。
  pieces:  # チャンクを構成するファイルを指定してください。指定したファイルが指定順に再生されます。
    # 指定したファイルを media/josei/ にて探します。ここに存在しない場合は、media/_common にて探します。
    - piece-1.mp3

- chunk_id: chunk-1-2
  pieces:
    - piece-2.mp3
    - _sl_2  # "_sl_" から始まる文字列を入れると、その秒数分無音のインターバルが挟まります。"_sl_2" なら2秒のインターバルです。
    - piece-3.mp3

- chunk_id: chunk-2
  interval_seconds: 2  # このチャンクにおいては、ピース間に毎回2秒の無音インターバルが入ります。
  pieces:
    - piece-4.mp3
    - piece-5.mp3

- chunk_id: chunk-3
  pieces:
    - piece-6.mp3
    - piece-7.mp4  # 動画ファイルを指定することもできます。
    - [piece-8.mp3, piece-img1.png]  # 音声ファイル（または"_sl_"）と画像ファイルを指定することで、その音声を再生中に画像を提示できます。
    - [_sl_5, piece-img2.jpeg]